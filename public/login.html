<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex min-h-screen items-center justify-center p-4 antialiased">

  <!-- Main Container Card -->
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl border border-gray-100">
    
    <!-- Form Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">Welcome Back</h1>
      <p class="mt-2 text-sm text-gray-600">Please enter your details to sign in</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-6" onsubmit="handleLogin(event)">
      
      <!-- Email Input -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          placeholder="name@example.com"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"
        >
      </div>

      <!-- Password Input -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-500">Forgot password?</a>
        </div>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            id="togglePasswordBtn"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-gray-500 hover:text-gray-700 select-none"
          >
            Show
          </button>
        </div>
      </div>

      <!-- Remember Me Checkbox -->
      <div class="flex items-center">
        <input 
          type="checkbox" 
          id="remember-me" 
          name="remember-me" 
          class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
        >
        <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember me</label>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-semibold text-white shadow-md hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition disabled:opacity-50"
      >
        Sign In
      </button>

    </form>

    <!-- Footer Links -->
    <p class="mt-8 text-center text-xs text-gray-500">
      Don't have an account? 
      <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500">Sign up</a>
    </p>

  </div>

  <!-- JavaScript for Form Interactions -->
  <script>
    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = 'Hide';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = 'Show';
      }
    }

    // Handle Form Submission
    function handleLogin(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Disable button and show loading state
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      console.log('Submitted Data:', { email, password });

      // Simulate network request delay
      setTimeout(() => {
        alert('Login submitted! Check the browser console (F12) for logged values.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }, 1000);
    }
  </script>

</body>
</html>
