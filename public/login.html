<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact Us | Bayanul Uloom Dars | Muttichira</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="AL BAYAN, Bayanul Uloom, Dars, Muttichira, Contact" name="keywords">
  <meta content="Contact Muttichira Bayanul Uloom Dars" name="description">
  <meta property="og:title" content="Contact Us | Bayanul Uloom Dars" />
  <meta property="og:description" content="Contact Muttichira Bayanul Uloom Dars" />
  <meta property="og:image" content="img/new_logo.png" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/favicon.png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Files -->
  <link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="lib/font-awesome/css/font-awesome.min.css" rel="stylesheet">
  <link href="lib/animate/animate.min.css" rel="stylesheet">
  <link href="lib/ionicons/css/ionicons.min.css" rel="stylesheet">
  
  <!-- Main Stylesheet Files -->
  <link href="css/style.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>

  <!-- Modern Header / Navbar -->
  <header id="header" class="fixed-top">
    <div class="navbar-container">
      <a href="/home" class="navbar-logo">
        <img src="img/new_logo.png" alt="BAYANUL ULOOM DARS Logo">
        <div class="logo-text">
          BAYANUL ULOOM DARS
          <small>MUTTICHIRA</small>
        </div>
      </a>

      <button class="mobile-toggle" onclick="document.querySelector('.nav-links').classList.toggle('show')">
        <i class="fa fa-bars"></i>
      </button>

      <ul class="nav-links">
        <li><a href="/home">Home</a></li>

        <li><a href="/gallery">Gallery</a></li>
        <li><a href="/admission" class="nav-btn-admission">Admission</a></li>
        <li><a href="/about">About Us</a></li>
        <li><a href="/contact" class="active">Contact Us</a></li>
        <li><a href="/login">Contact Us</a></li>
      </ul>
    </div>
  </header>
  <!-- Main Container Card -->
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl border border-gray-100">
    
    <!-- Brand Logo & Form Header -->
    <div class="text-center mb-8">
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white mb-4 shadow-md shadow-indigo-200">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">Welcome Back</h1>
      <p class="mt-2 text-sm text-gray-600">Please enter your details to sign in</p>
    </div>

    <!-- Social Login Buttons -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button type="button" class="flex items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white py-2.5 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition">
        <svg class="h-4 w-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google
      </button>

      <button type="button" class="flex items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white py-2.5 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition">
        <svg class="h-4 w-4 fill-current text-gray-900" viewBox="0 0 24 24">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        GitHub
      </button>
    </div>

    <!-- Divider -->
    <div class="relative mb-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-200"></div>
      </div>
      <div class="relative flex justify-center text-xs uppercase">
        <span class="bg-white px-3 text-gray-500 font-medium">Or continue with</span>
      </div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
      
      <!-- Email Input -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          placeholder="name@example.com"
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"
        >
      </div>

      <!-- Password Input -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-500">Forgot password?</a>
        </div>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition pr-10"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            id="togglePasswordBtn"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 select-none p-1"
            aria-label="Toggle Password Visibility"
          >
            <!-- Eye Open Icon -->
            <svg id="eyeIcon" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <!-- Eye Off Icon (hidden by default) -->
            <svg id="eyeOffIcon" class="h-5 w-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.024 10.024 0 013.122-.063c4.478 0 8.268 2.943 9.542 7a9.97 9.97 0 01-2.498 4.132M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Remember Me Checkbox -->
      <div class="flex items-center">
        <input 
          type="checkbox" 
          id="remember-me" 
          name="remember-me" 
          class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
        >
        <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember me for 30 days</label>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-semibold text-white shadow-md hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition disabled:opacity-50"
      >
        Sign In
      </button>

    </form>

    <!-- Footer Links -->
    <p class="mt-8 text-center text-xs text-gray-500">
      Don't have an account? 
      <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500">Sign up</a>
    </p>

  </div>

  <!-- JavaScript for Form Interactions -->
  <script>
    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeOffIcon = document.getElementById('eyeOffIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.add('hidden');
        eyeOffIcon.classList.remove('hidden');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('hidden');
        eyeOffIcon.classList.add('hidden');
      }
    }

    // Handle Form Submission
    function handleLogin(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Disable button and show loading state
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      console.log('Submitted Data:', { email, password });

      // Simulate network request delay
      setTimeout(() => {
        alert('Login submitted! Check the browser console (F12) for logged values.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }, 1000);
    }
  </script>

</body>
</html>
