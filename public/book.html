<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bayanul Uloom Digital Manuscript</title>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <link href="img/favicon.png" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="lib/font-awesome/css/font-awesome.min.css" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a1a10;
      font-family: 'Inter', sans-serif;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }

    .book-app {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0d2818 0%, #061a0e 50%, #040e08 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER BAR ── */
    .book-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(0,0,0,0.4);
      border-bottom: 1px solid rgba(212,175,55,0.15);
      z-index: 10;
      flex-shrink: 0;
    }

    .book-header .title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: #d4af37;
    }

    .book-header .subtitle {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.5);
    }

    .close-btn {
      background: rgba(212,175,55,0.12);
      border: 1px solid rgba(212,175,55,0.3);
      color: #d4af37;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .close-btn:active {
      background: #d4af37;
      color: #042515;
    }

    /* ── BOOK VIEWER ── */
    .book-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    /* The book wrapper - gives book shadow and depth */
    .book-frame {
      position: relative;
      width: 92%;
      max-width: 500px;
      height: 88%;
      max-height: 700px;
      background: #f5f0e0;
      border-radius: 2px 8px 8px 2px;
      box-shadow: 
        /* Left edge (spine shadow) */
        -4px 0 8px rgba(0,0,0,0.3),
        inset 4px 0 10px rgba(0,0,0,0.15),
        /* Page depth shadow */
        0 0 0 1px rgba(139,94,26,0.2),
        /* Elevation shadow */
        0 15px 50px rgba(0,0,0,0.6),
        0 5px 20px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* Spine edge decoration */
    .book-frame::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(to right, #5c4017, #8c6a21, #5c4017);
      z-index: 5;
    }

    /* Page edges visible on right */
    .book-frame::after {
      content: '';
      position: absolute;
      right: 0;
      top: 3%;
      bottom: 3%;
      width: 4px;
      background: repeating-linear-gradient(
        to bottom,
        #f5f0e0, #f5f0e0 2px,
        #d4ccb8 2px, #d4ccb8 3px
      );
      z-index: 5;
      border-radius: 0 2px 2px 0;
    }

    /* Current page image */
    .page-display {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 3px 3px 8px;
      background: #f5f0e0;
    }

    .page-display img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ── PAGE FLIP ANIMATION ── */
    .page-flip-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .page-flip {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      backface-visibility: hidden;
      background: #f5f0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 3px 3px 8px;
    }

    .page-flip img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Flip forward (next page) */
    @keyframes flipForward {
      0% { 
        transform: rotateY(0deg); 
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
      }
      50% { 
        box-shadow: -20px 0 40px rgba(0,0,0,0.4);
      }
      100% { 
        transform: rotateY(-180deg); 
        box-shadow: 0 0 5px rgba(0,0,0,0.1);
      }
    }

    /* Flip backward (prev page) */
    @keyframes flipBackward {
      0% { 
        transform: rotateY(-180deg); 
        box-shadow: 0 0 5px rgba(0,0,0,0.1);
      }
      50% { 
        box-shadow: 20px 0 40px rgba(0,0,0,0.4);
      }
      100% { 
        transform: rotateY(0deg); 
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
      }
    }

    .flip-forward {
      animation: flipForward 0.5s ease-in-out forwards;
    }

    .flip-backward {
      right: 0;
      transform-origin: right center;
      animation: flipBackward 0.5s ease-in-out forwards;
    }

    /* Touch arrows */
    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25%;
      z-index: 8;
      cursor: pointer;
    }
    .tap-zone.left { left: 0; }
    .tap-zone.right { right: 0; }

    .nav-arrow-hint {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .tap-zone:active .nav-arrow-hint { opacity: 1; }
    .tap-zone.left .nav-arrow-hint { left: 8px; }
    .tap-zone.right .nav-arrow-hint { right: 8px; }

    /* ── BOTTOM CONTROLS ── */
    .book-controls {
      padding: 8px 12px 12px;
      background: rgba(0,0,0,0.5);
      border-top: 1px solid rgba(212,175,55,0.1);
      flex-shrink: 0;
      z-index: 10;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #b8902a, #d4af37, #e8c84a);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .ctrl-btn {
      background: none;
      border: 1px solid rgba(212,175,55,0.25);
      color: #d4af37;
      padding: 7px 14px;
      border-radius: 18px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .ctrl-btn:active {
      background: rgba(212,175,55,0.2);
    }

    .ctrl-btn:disabled {
      opacity: 0.25;
    }

    .page-num {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      text-align: center;
      min-width: 60px;
    }

    .page-select {
      display: block;
      width: 100%;
      max-width: 180px;
      margin: 6px auto 0;
      padding: 5px 10px;
      border: 1px solid rgba(212,175,55,0.2);
      border-radius: 14px;
      background: rgba(0,0,0,0.3);
      color: #d4af37;
      font-weight: 600;
      font-size: 0.75rem;
      text-align: center;
      -webkit-appearance: none;
    }

    /* ── LOADING ── */
    .loading-spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      pointer-events: none;
    }

    .loading-spinner .dot {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(212,175,55,0.15);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Safe area */
    @supports (padding: env(safe-area-inset-bottom)) {
      .book-controls { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .book-header { padding-top: calc(8px + env(safe-area-inset-top)); }
    }

    /* Desktop tweaks */
    @media (min-width: 768px) {
      .book-frame { max-width: 550px; max-height: 750px; border-radius: 3px 10px 10px 3px; }
      .tap-zone { width: 20%; }
      .ctrl-btn { padding: 9px 20px; font-size: 0.85rem; }
      .page-num { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<div class="book-app">
  <!-- Header -->
  <div class="book-header">
    <div>
      <div class="title">ഡിജിറ്റൽ കൈപ്പുസ്തകം</div>
      <div class="subtitle">Bayanul Uloom Dars 2026</div>
    </div>
    <button class="close-btn" onclick="closeBook()" aria-label="Close">&times;</button>
  </div>

  <!-- Book Stage -->
  <div class="book-stage" id="bookStage">
    <div class="book-frame" id="bookFrame">
      <div class="page-display" id="pageDisplay">
        <img id="pageImg" src="" alt="Page">
      </div>
      <div class="page-flip-layer" id="flipLayer"></div>
      <div class="loading-spinner" id="loader"><div class="dot"></div></div>

      <!-- Tap zones for navigation -->
      <div class="tap-zone left" onclick="goPage(-1)">
        <div class="nav-arrow-hint"><i class="fa fa-chevron-left"></i></div>
      </div>
      <div class="tap-zone right" onclick="goPage(1)">
        <div class="nav-arrow-hint"><i class="fa fa-chevron-right"></i></div>
      </div>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="book-controls">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="controls-row">
      <button class="ctrl-btn" id="prevBtn" onclick="goPage(-1)"><i class="fa fa-chevron-left"></i> മുൻപ്</button>
      <span class="page-num" id="pageNum">1 / 28</span>
      <button class="ctrl-btn" id="nextBtn" onclick="goPage(1)">അടുത്തത് <i class="fa fa-chevron-right"></i></button>
    </div>
    <select class="page-select" id="pageSelect" onchange="jumpTo(this.value)"></select>
  </div>
</div>

<script>
  const TOTAL = 28;
  let cur = 1;
  let busy = false;

  const pageImg = document.getElementById('pageImg');
  const pageNum = document.getElementById('pageNum');
  const progressFill = document.getElementById('progressFill');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const loader = document.getElementById('loader');
  const pageSelect = document.getElementById('pageSelect');
  const flipLayer = document.getElementById('flipLayer');
  const bookStage = document.getElementById('bookStage');

  // Populate selector
  for (let i = 1; i <= TOTAL; i++) {
    const o = document.createElement('option');
    o.value = i;
    o.text = i === 1 ? 'കവർ (Cover)' : i === TOTAL ? 'പിൻ കവർ (Back)' : `താൾ ${i}`;
    pageSelect.appendChild(o);
  }

  // Image cache
  const imgCache = {};
  function preload(n) {
    if (n >= 1 && n <= TOTAL && !imgCache[n]) {
      const img = new Image();
      img.src = `img/kaypusthakam/page (${n}).jpg`;
      imgCache[n] = img;
    }
  }

  function imgSrc(n) {
    return `img/kaypusthakam/page (${n}).jpg`;
  }

  function updateUI() {
    pageNum.textContent = `${cur} / ${TOTAL}`;
    progressFill.style.width = `${(cur / TOTAL) * 100}%`;
    pageSelect.value = cur;
    prevBtn.disabled = cur <= 1;
    nextBtn.disabled = cur >= TOTAL;
  }

  // Show page with flip animation
  function showPage(n, direction) {
    if (n < 1 || n > TOTAL || busy) return;
    if (n === cur) return;
    
    busy = true;
    const oldPage = cur;
    cur = n;
    updateUI();

    // Preload neighbors
    preload(n + 1);
    preload(n - 1);
    preload(n + 2);

    // Create flip animation
    const flipEl = document.createElement('div');
    flipEl.className = 'page-flip';
    
    if (direction === 'next') {
      // Flip shows old page flying away
      flipEl.innerHTML = `<img src="${imgSrc(oldPage)}" alt="">`;
      flipEl.classList.add('flip-forward');
      flipLayer.appendChild(flipEl);
      
      // Immediately show new page underneath
      pageImg.src = imgSrc(n);
    } else {
      // Flip shows new page arriving
      flipEl.innerHTML = `<img src="${imgSrc(n)}" alt="">`;
      flipEl.classList.add('flip-backward');
      flipLayer.appendChild(flipEl);
    }

    // Clean up after animation
    flipEl.addEventListener('animationend', () => {
      flipLayer.innerHTML = '';
      if (direction === 'prev') {
        pageImg.src = imgSrc(n);
      }
      busy = false;
    });

    // Safety timeout
    setTimeout(() => {
      flipLayer.innerHTML = '';
      pageImg.src = imgSrc(n);
      busy = false;
    }, 600);
  }

  function goPage(dir) {
    showPage(cur + dir, dir > 0 ? 'next' : 'prev');
  }

  function jumpTo(val) {
    const n = parseInt(val);
    if (n === cur) return;
    showPage(n, n > cur ? 'next' : 'prev');
  }

  function closeBook() {
    window.location.href = '/';
  }

  // ── SWIPE ──
  let sx = 0, sy = 0, st = 0;

  bookStage.addEventListener('touchstart', (e) => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    st = Date.now();
  }, { passive: true });

  bookStage.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    const dt = Date.now() - st;
    
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3 && dt < 600) {
      if (dx < 0) goPage(1);   // swipe left → next
      else goPage(-1);          // swipe right → prev
    }
  }, { passive: true });

  // ── KEYBOARD ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goPage(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goPage(-1); }
    if (e.key === 'Escape') closeBook();
  });

  // ── BACK BUTTON ──
  history.pushState({ p: 'book' }, '', location.href);
  addEventListener('popstate', () => closeBook());

  // ── INIT ──
  loader.style.display = 'flex';
  const firstImg = new Image();
  firstImg.onload = firstImg.onerror = () => {
    pageImg.src = imgSrc(1);
    loader.style.display = 'none';
    updateUI();
    preload(2);
    preload(3);
  };
  firstImg.src = imgSrc(1);
</script>
</body>
</html>
