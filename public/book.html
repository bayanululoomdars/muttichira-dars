<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bayanul Uloom Digital Manuscript</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="img/favicon.png" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link href="lib/font-awesome/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- PageFlip Library (Realistic 3D Book Turn) - Local -->
  <script src="js/page-flip.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1a10;
      font-family: 'Inter', sans-serif;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }
    
    .app-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: linear-gradient(135deg, #0d2818 0%, #061a0e 50%, #040e08 100%);
    }
    
    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0,0,0,0.5);
      border-bottom: 1px solid rgba(212,175,55,0.15);
      flex-shrink: 0;
      z-index: 10;
    }
    .header-text .title { font-family: 'Outfit', sans-serif; font-weight: 700; color: #d4af37; font-size: 1rem; }
    .header-text .subtitle { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
    
    .close-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.4);
      color: #d4af37;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
      transition: all 0.3s;
    }
    .close-btn:active { background: #d4af37; color: #042515; }

    /* ── BOOK STAGE ── */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 15px;
    }
    
    .rotate-hint {
      display: none !important; /* Removed as we now support portrait perfectly */
    }

    #book {
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      border-radius: 4px;
    }
    
    /* ── PAGE STYLING ── */
    .page {
      background-color: #fdfaf2; /* Paper color for letterboxing margins */
      overflow: hidden;
    }
    
    /* Realistic book page gradients (spine shadow) */
    .page::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 8%, rgba(0,0,0,0) 92%, rgba(0,0,0,0.12) 100%);
      pointer-events: none;
      z-index: 5;
    }
    
    .page.--right::before {
      background: linear-gradient(to right, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 10%);
    }
    
    .page.--left::before {
      background: linear-gradient(to left, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 10%);
    }
    
    .page-content {
      width: 100%;
      height: 100%;
      padding: 0; /* Remove padding to maximize size */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .page-content img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* PERFECT RATIO: No stretching/distortion! */
    }

    /* ── LOADER ── */
    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: #0a1a10;
    }
    .spinner {
      width: 45px; height: 45px;
      border: 4px solid rgba(212,175,55,0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* ── FOOTER CONTROLS ── */
    .controls {
      background: rgba(0,0,0,0.6);
      padding: 12px 20px;
      border-top: 1px solid rgba(212,175,55,0.2);
      flex-shrink: 0;
    }
    
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    
    .btn-nav {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.4);
      color: #d4af37;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-nav:active { 
      background: #d4af37; 
      color: #042515; 
      transform: scale(0.95);
    }
    
    .page-info {
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      text-align: center;
      flex: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    /* Safe area for mobile */
    @supports (padding: env(safe-area-inset-bottom)) {
      .controls { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .header { padding-top: calc(10px + env(safe-area-inset-top)); }
    }
  </style>
</head>
<body>
  
  <div class="loader" id="loader"><div class="spinner"></div></div>
  
  <div class="app-layout">
    <!-- Header -->
    <div class="header">
      <div class="header-text">
        <div class="title">ഡിജിറ്റൽ കൈപ്പുസ്തകം</div>
        <div class="subtitle">Bayanul Uloom Dars 2026</div>
      </div>
      <button class="close-btn" onclick="window.location.href='/'">&times;</button>
    </div>
    
    <!-- Stage -->
    <div class="stage" id="stage">
      <div class="rotate-hint" id="rotateHint"><i class="fa fa-refresh"></i> ഫോൺ തിരിച്ച് പിടിക്കുക (Landscape)</div>
      <div id="book">
        <!-- Pages injected dynamically -->
      </div>
    </div>
    
    <!-- Controls -->
    <div class="controls">
      <div class="controls-row">
        <button class="btn-nav" id="btnPrev"><i class="fa fa-chevron-left"></i> മുൻപ്</button>
        <div class="page-info" id="pageInfo">കവർ പേജ്</div>
        <button class="btn-nav" id="btnNext">തുടരുക <i class="fa fa-chevron-right"></i></button>
      </div>
    </div>
  </div>
  
  <script>
    const TOTAL_PAGES = 28;
    const bookEl = document.getElementById('book');
    const loader = document.getElementById('loader');
    
    // Inject all pages into the DOM
    for (let i = 1; i <= TOTAL_PAGES; i++) {
        const page = document.createElement('div');
        page.className = 'page';
        page.innerHTML = `
            <div class="page-content">
                <img src="img/kaypusthakam/page (${i}).jpg" alt="Page ${i}" loading="lazy">
            </div>
        `;
        bookEl.appendChild(page);
    }
    
    // Initialize PageFlip
    try {
        const pageFlip = new St.PageFlip(bookEl, {
            width: 420,           // Base page width
            height: 594,          // Base page height (A4 proportion)
            size: "stretch",      // MUST BE 'stretch' or 'fixed'
            minWidth: 200,
            maxWidth: 600,
            minHeight: 300,
            maxHeight: 900,
            showCover: true,      // First & Last page centered!
            usePortrait: true,    // AUTOMATIC SINGLE PAGE ON MOBILE
            maxShadowOpacity: 0.5,
            drawShadow: true,
            flippingTime: 700,    // Book turning speed
            swipeDistance: 30,    // Easy swipe threshold
            autoSize: true
        });
        
        // Load pages
        pageFlip.loadFromHTML(document.querySelectorAll('.page'));
        
        // UI Elements
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const pageInfo = document.getElementById('pageInfo');
        
        btnPrev.addEventListener('click', () => { pageFlip.flipPrev(); });
        btnNext.addEventListener('click', () => { pageFlip.flipNext(); });
        
        // Listen to flip event to update page numbers
        pageFlip.on('flip', (e) => {
            const curIndex = e.data;
            const pageNum = curIndex + 1;
            
            if (curIndex === 0) {
                pageInfo.textContent = 'കവർ പേജ് (Cover)';
            } else if (curIndex === TOTAL_PAGES - 1) {
                pageInfo.textContent = 'പിൻ കവർ (Back Cover)';
            } else {
                const rightPage = pageNum + 1;
                if(rightPage <= TOTAL_PAGES) {
                    pageInfo.textContent = `താൾ ${pageNum} - ${rightPage}`;
                } else {
                    pageInfo.textContent = `താൾ ${pageNum}`;
                }
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') pageFlip.flipNext();
            if (e.key === 'ArrowLeft') pageFlip.flipPrev();
            if (e.key === 'Escape') window.location.href = '/';
        });

    } catch(err) {
        console.error("Book Init Error:", err);
        alert("പുസ്തകം ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല. ദയവായി പേജ് റിഫ്രഷ് ചെയ്യുക.");
    } finally {
        // Always hide loader after a short delay
        setTimeout(() => {
            if(loader) loader.style.display = 'none';
        }, 500);
    }
    
    // Hardware Back Button (Android)
    window.history.pushState({ p: 'book' }, '', window.location.href);
    window.addEventListener('popstate', () => { window.location.href = '/'; });
  </script>
</body>
</html>
