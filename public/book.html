<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <title>ഡിജിറ്റൽ കൈപ്പുസ്തകം | Bayanul Uloom Digital Manuscript</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  
  <!-- Favicons -->
  <link href="img/favicon.png" rel="icon">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Outfit:400,600,700|Inter:400,600,700" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --primary: #0a4d2e;
      --primary-dark: #06301c;
      --accent: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle, #0e4429 0%, #062012 100%);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      color: #fff;
    }

    .header-bar {
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .header-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title span {
      color: var(--accent);
    }

    .home-link {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 6px 15px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      transition: 0.3s;
    }

    .home-link:hover {
      background: #fff;
      color: var(--primary-dark);
    }

    /* ── 3D BOOK ENGINE ──────────────────────────── */
    .book-viewport {
      width: 100%;
      max-width: 600px;
      height: 420px;
      perspective: 1600px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-top: 50px;
    }

    .book-container-3d {
      width: 600px;
      height: 420px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .book-spine-3d {
      position: absolute;
      left: 50%;
      top: 0;
      width: 10px;
      height: 100%;
      background: linear-gradient(90deg, #1f1406, #3b2811, #1f1406);
      transform: translateX(-50%) translateZ(1px);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      border-radius: 2px;
      z-index: 100;
    }

    .book-sheet-3d {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 10;
    }

    /* Position sheets on the right side initially */
    .book-sheet-3d {
      left: 50%;
    }

    /* Flipped state: turned to the left */
    .flipped-sheet-3d {
      transform: rotateY(-180deg);
    }

    .book-page-3d {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      box-shadow: inset 3px 0 10px rgba(0,0,0,0.1), 5px 5px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      background: #fdfaf2;
    }

    .page-front-3d {
      z-index: 2;
    }

    .page-back-3d {
      transform: rotateY(180deg);
      z-index: 1;
    }

    /* Parchment styling for fallback */
    .parchment-page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 30px;
      background: #f4ebd0;
      box-shadow: inset 0 0 40px rgba(139,94,26,0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 4px double rgba(93,64,27,0.3);
      pointer-events: none;
    }

    .parchment-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #5d401b;
      text-align: center;
      border-bottom: 1px solid rgba(139,94,26,0.2);
      padding-bottom: 5px;
    }

    .parchment-content-text {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #3e270f;
      text-align: center;
      margin: auto 0;
      padding: 10px 0;
    }

    .parchment-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #8c6a21;
      font-weight: 600;
      border-top: 1px solid rgba(139,94,26,0.15);
      padding-top: 5px;
    }

    .parchment-cover-page {
      background: linear-gradient(135deg, #5c4017 0%, #2f200b 100%);
      border: 12px double var(--accent);
      color: #fff;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
    }

    .parchment-cover-page .parchment-title {
      color: var(--accent);
      font-size: 1.5rem;
      border-bottom-color: rgba(212,175,55,0.3);
      margin-top: 20px;
    }

    .parchment-cover-page .parchment-content-text {
      color: #f5eedc;
    }

    .parchment-cover-page .parchment-footer {
      color: var(--accent);
      border-top-color: rgba(212,175,55,0.3);
    }

    /* Controls */
    .flipbook-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 40px;
    }

    .flipbook-controls button {
      background: var(--primary);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .flipbook-controls button:hover {
      background: var(--accent);
      color: var(--primary-dark);
      box-shadow: 0 4px 15px rgba(212,175,55,0.3);
    }

    .flipbook-controls span {
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      min-width: 140px;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .flipbook-select-jump {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--accent);
      background: #fff;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .book-viewport {
        margin-top: 80px;
      }
    }

    @media (max-width: 576px) {
      .header-bar {
        padding: 10px 15px;
      }
      .header-title {
        font-size: 0.9rem;
      }
      .header-title span {
        display: none; /* Hide subtitle to fit title on narrow mobile */
      }
      .home-link {
        font-size: 0.8rem;
        padding: 4px 10px;
      }
      .flipbook-controls {
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 25px;
        padding: 0 10px;
      }
      .flipbook-controls button {
        padding: 8px 14px;
        font-size: 0.8rem;
      }
      .flipbook-controls span {
        font-size: 0.95rem;
        min-width: 100px;
      }
      .flipbook-select-jump {
        padding: 6px 10px;
        font-size: 0.8rem;
        width: 100%;
        max-width: 200px;
        margin-top: 10px;
        text-align: center;
      }
    }
  </style>
</head>

    <select class="flipbook-select-jump" id="pageJumpSelect" onchange="jumpToPage(this.value)">
      <!-- Populate dynamically -->
    </select>
  </div>

  <script>

      { title: "ഇന്നത്തെ സാരഥികൾ", desc: "ദർസിന് നേതൃത്വം നൽകുന്ന ബഹുമാനപ്പെട്ട പ്രധാന മുദരിസും മറ്റ് മുദരിസുമാരും.", label: "Present Leaders" },

      { title: "വിദ്യാർത്ഥി രചനകൾ - കവിതകൾ", desc: "വിദ്യാർത്ഥികൾ സ്വയം രചിച്ച മലയാളം, അറബിക് ഭക്തിസാന്ദ്രമായ കവിതകൾ.", label: "Student Poems" },
      { title: "ലേഖനങ്ങൾ & പ്രബന്ധങ്ങൾ", desc: "ആധുനിക സാമൂഹിക വിഷയങ്ങളിലുള്ള പഠനാർഹമായ ലേഖനങ്ങൾ.", label: "Student Articles" },

      { title: "അൽ ബയാൻ മീഡിയ വിംഗ്", desc: "ദർസിന്റെ പ്രവർത്തനങ്ങൾ ഡിജിറ്റലായി ലോകത്തെ അറിയിക്കുന്ന മീഡിയ പ്ലാറ്റ്ഫോം.", label: "Al Bayan Media" },

    function initManuscriptFlipbook() {
      const flipbook = document.getElementById('flipbook');
      if (!flipbook) return;

      flipbook.innerHTML = '<div class="book-spine-3d"></div>'; // reset
      for (let i = 0; i < manuscriptTotalSheets; i++) {
        const sheet = document.createElement('div');
        sheet.className = 'book-sheet-3d';
        sheet.id = `sheet-${i}`;
        
        const idxFront = 2 * i;
        const idxBack = 2 * i + 1;
        
        const pageFront = manuscriptPagesData[idxFront];
        const pageBack = manuscriptPagesData[idxBack];
        
        const numFront = idxFront + 1;
        const numBack = idxBack + 1;
        
        sheet.innerHTML = `
          <div class="book-page-3d page-front-3d" onclick="flipNext()">
            <img src="img/kaypusthakam/page${numFront}.jpg" onload="this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" style="width:100%; height:100%; object-fit:contain;" alt="Page ${numFront}">
            <div class="parchment-page ${numFront === 1 ? 'parchment-cover-page' : ''}">
              <div class="parchment-title">${pageFront.title}</div>
              <div class="parchment-content-text">${pageFront.desc}</div>
              <div class="parchment-footer">
                <span>ബയാനുൽ ഉലൂം</span>
                <span>താൾ ${numFront}</span>
              </div>
            </div>
          </div>
          <div class="book-page-3d page-back-3d" onclick="flipPrev()">
            <img src="img/kaypusthakam/page${numBack}.jpg" onload="this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" style="width:100%; height:100%; object-fit:contain;" alt="Page ${numBack}">
            <div class="parchment-page ${numBack === 28 ? 'parchment-cover-page' : ''}">
              <div class="parchment-title">${pageBack.title}</div>
              <div class="parchment-content-text">${pageBack.desc}</div>
              <div class="parchment-footer">
                <span>താൾ ${numBack}</span>
                <span>ബയാനുൽ ഉലൂം</span>
              </div>
            </div>
          </div>
        `;
        flipbook.appendChild(sheet);
      }

      // Populate Jump Select
      const select = document.getElementById('pageJumpSelect');
      if (select) {
        select.innerHTML = '';
        const optCover = document.createElement('option');
        optCover.value = 0;
        optCover.innerText = "കവർ പേജ് (തൂവൽ 1)";
        select.appendChild(optCover);
        
        for (let i = 1; i < manuscriptTotalSheets; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.innerText = `താൾ ${2 * i} - ${2 * i + 1}`;
          select.appendChild(opt);
        }
        
        const optBack = document.createElement('option');
        optBack.value = manuscriptTotalSheets;
        optBack.innerText = "പിൻ കവർ (തൂവൽ 28)";
        select.appendChild(optBack);
      }

      updateFlipbook();
      scaleBook();

      // Bind touch swipe
      const bookViewport = document.querySelector('.book-viewport');
      if (bookViewport) {
        let touchStartX = 0;
        let touchEndX = 0;
        bookViewport.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        bookViewport.addEventListener('touchend', (e) => {
          touchEndX = e.changedTouches[0].screenX;
          const swipeThreshold = 50;
          if (touchStartX - touchEndX > swipeThreshold) {
            flipNext();
          } else if (touchEndX - touchStartX > swipeThreshold) {
            flipPrev();
          }
        }, { passive: true });
      }
    }

    function updateFlipbook() {
      for (let i = 0; i < manuscriptTotalSheets; i++) {
        const sheet = document.getElementById(`sheet-${i}`);
        if (!sheet) continue;
        
        if (i < manuscriptSheetIndex) {
          sheet.classList.add('flipped-sheet-3d');
          sheet.style.zIndex = i + 1;
        } else {
          sheet.classList.remove('flipped-sheet-3d');
          sheet.style.zIndex = manuscriptTotalSheets - i;
        }
      }
      
      const indicator = document.getElementById('pageIndicator');
      if (indicator) {
        if (manuscriptSheetIndex === 0) {
          indicator.innerText = `തൂവൽ 1 / 28`;
        } else if (manuscriptSheetIndex === manuscriptTotalSheets) {
          indicator.innerText = `തൂവൽ 28 / 28`;
        } else {
          indicator.innerText = `താൾ ${manuscriptSheetIndex * 2} - ${manuscriptSheetIndex * 2 + 1} / 28`;
        }
      }

      const select = document.getElementById('pageJumpSelect');
      if (select) select.value = manuscriptSheetIndex;

      scaleBook(); // Update translation and scale
    }

    function flipNext() {
      if (manuscriptSheetIndex < manuscriptTotalSheets) {
        manuscriptSheetIndex++;
        updateFlipbook();
      }
    }

    function flipPrev() {
      if (manuscriptSheetIndex > 0) {
        manuscriptSheetIndex--;
        updateFlipbook();
      }
    }

    function jumpToPage(sheetIndex) {
      manuscriptSheetIndex = parseInt(sheetIndex);
      if (manuscriptSheetIndex < 0) manuscriptSheetIndex = 0;
      if (manuscriptSheetIndex > manuscriptTotalSheets) manuscriptSheetIndex = manuscriptTotalSheets;
      updateFlipbook();
    }

    function scaleBook() {
      const viewport = document.querySelector('.book-viewport');
      const book = document.getElementById('flipbook');
      if (!viewport || !book) return;

      const viewportWidth = viewport.clientWidth;
      const bookWidth = 600;
      
      // Calculate translation for centering first/last sheet
      let tx = 0;
      if (manuscriptSheetIndex === 0) {
        tx = -150; // Shift left by half-page width to center right page (page 1)
      } else if (manuscriptSheetIndex === manuscriptTotalSheets) {
        tx = 150; // Shift right by half-page width to center left page (page 28)
      }

      if (viewportWidth < bookWidth) {
        const scale = (viewportWidth - 10) / bookWidth;
        book.style.transform = `scale(${scale}) translateX(${tx}px)`;
        viewport.style.height = `${420 * scale}px`;
      } else {
        book.style.transform = `scale(1) translateX(${tx}px)`;
        viewport.style.height = '420px';
      }
    }

    document.addEventListener('DOMContentLoaded', initManuscriptFlipbook);
    window.addEventListener('resize', scaleBook);
  </script>
</body>
</html>
