<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bayanul Uloom Digital Manuscript</title>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <link href="img/favicon.png" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="lib/font-awesome/css/font-awesome.min.css" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #021a0e;
      font-family: 'Inter', sans-serif;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
    }

    .book-app {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #031a0c 0%, #042515 50%, #021008 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER BAR ── */
    .book-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212,175,55,0.2);
      z-index: 10;
      flex-shrink: 0;
    }

    .book-header .title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: #d4af37;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-header .subtitle {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }

    .close-btn {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.4);
      color: #d4af37;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .close-btn:hover, .close-btn:active {
      background: #d4af37;
      color: #042515;
    }

    /* ── PAGE VIEWER (MAIN AREA) ── */
    .page-viewer {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .page-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      transition: opacity 0.3s ease;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Swipe hint arrows */
    .swipe-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.3);
      color: #d4af37;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: all 0.3s;
    }

    .swipe-arrow:hover, .swipe-arrow:active {
      background: rgba(212,175,55,0.4);
    }

    .swipe-arrow.left { left: 8px; }
    .swipe-arrow.right { right: 8px; }

    .swipe-arrow.disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    /* ── BOTTOM CONTROLS ── */
    .book-controls {
      padding: 10px 12px 14px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(212,175,55,0.15);
      flex-shrink: 0;
      z-index: 10;
    }

    /* Progress bar */
    .progress-bar-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #f0d060);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .nav-btn {
      background: rgba(212,175,55,0.12);
      border: 1px solid rgba(212,175,55,0.3);
      color: #d4af37;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .nav-btn:active {
      background: #d4af37;
      color: #042515;
      transform: scale(0.95);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .page-info {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      min-width: 80px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .page-jump {
      width: 100%;
      max-width: 200px;
      margin: 8px auto 0;
      display: block;
      padding: 6px 12px;
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 16px;
      background: rgba(0,0,0,0.3);
      color: #d4af37;
      font-weight: 600;
      font-size: 0.8rem;
      text-align: center;
      cursor: pointer;
      -webkit-appearance: none;
    }

    /* ── LOADING SPINNER ── */
    .page-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      z-index: 3;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(212,175,55,0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── SAFE AREA for notch phones ── */
    @supports (padding: env(safe-area-inset-bottom)) {
      .book-controls {
        padding-bottom: calc(14px + env(safe-area-inset-bottom));
      }
      .book-header {
        padding-top: calc(10px + env(safe-area-inset-top));
      }
    }

    /* Desktop: slightly larger arrows */
    @media (min-width: 768px) {
      .swipe-arrow {
        width: 54px;
        height: 54px;
        font-size: 1.3rem;
      }
      .swipe-arrow.left { left: 20px; }
      .swipe-arrow.right { right: 20px; }
      .page-info { font-size: 1rem; }
      .nav-btn { padding: 10px 22px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<div class="book-app">
  <!-- Header -->
  <div class="book-header">
    <div>
      <div class="title">ബയാനുൽ ഉലൂം ഡിജിറ്റൽ കൈപ്പുസ്തകം</div>
      <div class="subtitle">Bayanul Uloom Digital Manuscript 2026</div>
    </div>
    <button class="close-btn" onclick="closeBook()" aria-label="Close">&times;</button>
  </div>

  <!-- Page Viewer -->
  <div class="page-viewer" id="pageViewer">
    <div class="page-container" id="pageContainer">
      <div class="page-loading" id="pageLoading"><div class="spinner"></div></div>
      <img class="page-img" id="pageImg" src="" alt="Page">
    </div>
    <button class="swipe-arrow left" id="arrowLeft" onclick="goPage(-1)"><i class="fa fa-chevron-left"></i></button>
    <button class="swipe-arrow right" id="arrowRight" onclick="goPage(1)"><i class="fa fa-chevron-right"></i></button>
  </div>

  <!-- Bottom Controls -->
  <div class="book-controls">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="controls-row">
      <button class="nav-btn" id="prevBtn" onclick="goPage(-1)"><i class="fa fa-chevron-left"></i> മുൻപ്</button>
      <span class="page-info" id="pageInfo">1 / 28</span>
      <button class="nav-btn" id="nextBtn" onclick="goPage(1)">അടുത്തത് <i class="fa fa-chevron-right"></i></button>
    </div>
    <select class="page-jump" id="pageJump" onchange="jumpTo(this.value)"></select>
  </div>
</div>

<script>
  const TOTAL_PAGES = 28;
  let currentPage = 1;
  let isAnimating = false;

  const pageImg = document.getElementById('pageImg');
  const pageInfo = document.getElementById('pageInfo');
  const progressFill = document.getElementById('progressFill');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const arrowLeft = document.getElementById('arrowLeft');
  const arrowRight = document.getElementById('arrowRight');
  const pageLoading = document.getElementById('pageLoading');
  const pageJump = document.getElementById('pageJump');
  const pageViewer = document.getElementById('pageViewer');

  // Populate page jump selector
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    if (i === 1) opt.text = 'കവർ പേജ് (Cover)';
    else if (i === TOTAL_PAGES) opt.text = 'പിൻ കവർ (Back Cover)';
    else opt.text = `താൾ ${i} / ${TOTAL_PAGES}`;
    pageJump.appendChild(opt);
  }

  // Preload adjacent images for smooth experience
  function preloadPage(num) {
    if (num >= 1 && num <= TOTAL_PAGES) {
      const img = new Image();
      img.src = `img/kaypusthakam/page (${num}).jpg`;
    }
  }

  function showPage(num) {
    if (num < 1 || num > TOTAL_PAGES || isAnimating) return;
    isAnimating = true;
    currentPage = num;

    // Show loading
    pageLoading.style.display = 'flex';
    pageImg.style.opacity = '0';

    const src = `img/kaypusthakam/page (${num}).jpg`;
    
    // Create new image to detect load
    const tempImg = new Image();
    tempImg.onload = function() {
      pageImg.src = src;
      pageImg.style.opacity = '1';
      pageLoading.style.display = 'none';
      isAnimating = false;
    };
    tempImg.onerror = function() {
      // Show fallback — still show the page
      pageImg.src = src;
      pageImg.style.opacity = '1';
      pageLoading.style.display = 'none';
      isAnimating = false;
    };
    tempImg.src = src;

    // Update UI
    pageInfo.textContent = `${num} / ${TOTAL_PAGES}`;
    progressFill.style.width = `${(num / TOTAL_PAGES) * 100}%`;
    pageJump.value = num;

    // Update button states
    prevBtn.disabled = (num <= 1);
    nextBtn.disabled = (num >= TOTAL_PAGES);
    arrowLeft.classList.toggle('disabled', num <= 1);
    arrowRight.classList.toggle('disabled', num >= TOTAL_PAGES);

    // Preload neighbors
    preloadPage(num + 1);
    preloadPage(num - 1);
  }

  function goPage(dir) {
    showPage(currentPage + dir);
  }

  function jumpTo(val) {
    showPage(parseInt(val));
  }

  function closeBook() {
    window.location.href = '/';
  }

  // ── TOUCH SWIPE HANDLING ──
  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;
  let isSwiping = false;

  pageViewer.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
    isSwiping = true;
  }, { passive: true });

  pageViewer.addEventListener('touchmove', (e) => {
    if (!isSwiping) return;
    const dx = Math.abs(e.touches[0].clientX - touchStartX);
    const dy = Math.abs(e.touches[0].clientY - touchStartY);
    // If horizontal movement dominates, prevent scroll
    if (dx > dy && dx > 10) {
      e.preventDefault();
    }
  }, { passive: false });

  pageViewer.addEventListener('touchend', (e) => {
    if (!isSwiping) return;
    isSwiping = false;
    
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dt = Date.now() - touchStartTime;
    
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    
    // Only trigger if horizontal, fast enough, and far enough
    if (absDx > 40 && absDx > absDy * 1.5 && dt < 500) {
      if (dx < 0) {
        goPage(1); // Swipe left → next page
      } else {
        goPage(-1); // Swipe right → previous page
      }
    }
  }, { passive: true });

  // ── KEYBOARD SUPPORT ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goPage(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goPage(-1); }
    if (e.key === 'Escape') closeBook();
  });

  // ── BACK BUTTON SUPPORT ──
  window.history.pushState({ page: 'book' }, '', window.location.href);
  window.addEventListener('popstate', () => closeBook());

  // ── INIT ──
  showPage(1);
</script>
</body>
</html>
